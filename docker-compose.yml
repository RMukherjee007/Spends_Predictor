services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spends
      POSTGRES_PASSWORD: spends
      POSTGRES_DB: spends
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spends -d spends"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/spends
      SPRING_DATASOURCE_USERNAME: spends
      SPRING_DATASOURCE_PASSWORD: spends
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DEV_LOGIN_ENABLED: "true"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
