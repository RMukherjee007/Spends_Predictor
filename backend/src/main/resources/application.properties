server.port=${PORT:8000}
spring.application.name=Spends Predictor
spring.jackson.property-naming-strategy=SNAKE_CASE

# Database: defaults to local file-backed H2 in PostgreSQL compatibility mode;
# override with SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/spends for PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./spends_dev_java;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spends}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spends}

# Application settings (mapped from environment variables)
app.environment=${ENVIRONMENT:development}
app.default-currency=${DEFAULT_CURRENCY:INR}
app.jwt-secret=${JWT_SECRET:dev-insecure-change-me-dev-insecure-change-me}
app.jwt-issuer=${JWT_ISSUER:spends-predictor}
app.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
app.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}
app.dev-login-enabled=${DEV_LOGIN_ENABLED:false}
app.cookie-secure=${COOKIE_SECURE:true}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.field-encryption-keys=${FIELD_ENCRYPTION_KEYS:}
app.ledger-signing-key=${LEDGER_SIGNING_KEY:}
app.google-client-ids=${GOOGLE_CLIENT_IDS:}
