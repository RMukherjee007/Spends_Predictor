name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Ruff, Mypy, Pytest, Alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spends
          POSTGRES_PASSWORD: spends
          POSTGRES_DB: spends_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint & format check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck (Mypy)
        run: mypy app tests

      - name: Run migrations against Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://spends:spends@localhost:5432/spends_test
        run: alembic upgrade head

      - name: Run test suite against Postgres
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spends:spends@localhost:5432/spends_test
        run: pytest -v --cov=app

      - name: Verify OpenAPI schema is up to date
        run: |
          python -m app.scripts.export_openapi ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json

  frontend:
    name: Frontend (ESLint, TypeScript, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated OpenAPI TypeScript types
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
