name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fullstack:
    name: Full-Stack Java 21 Spring Boot (Thymeleaf + HTMX + QuantCore) & Python ML
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spends
          POSTGRES_PASSWORD: spends
          POSTGRES_DB: spends_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python ML engine dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.in pytest ruff mypy

      - name: Lint & typecheck Python ML engine (Ruff + Mypy)
        run: |
          .venv/bin/ruff check app tests
          .venv/bin/ruff format --check app tests
          .venv/bin/mypy app tests

      - name: Run Python ML engine unit tests
        run: .venv/bin/pytest -v

      - name: Run Java 21 Spring Boot full-stack test suite (REST API, Thymeleaf+HTMX UI, QuantCore, Ledger Audit)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/spends_test
          SPRING_DATASOURCE_USERNAME: spends
          SPRING_DATASOURCE_PASSWORD: spends
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        run: mvn -B test
