name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java Spring Boot 3 Maven + Python ML & C++20)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spends
          POSTGRES_PASSWORD: spends
          POSTGRES_DB: spends_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python ML engine dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.in pytest ruff mypy

      - name: Lint & typecheck Python ML engine (Ruff + Mypy)
        run: |
          .venv/bin/ruff check app tests
          .venv/bin/ruff format --check app tests
          .venv/bin/mypy app tests

      - name: Run Python ML & C++20 kernel tests
        run: .venv/bin/pytest -v

      - name: Run Java Spring Boot 3 integration test suite against Postgres
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/spends_test
          SPRING_DATASOURCE_USERNAME: spends
          SPRING_DATASOURCE_PASSWORD: spends
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        run: mvn -B test

  frontend:
    name: Frontend (ESLint, TypeScript, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated OpenAPI TypeScript types
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
