# Render Blueprint (https://render.com/docs/blueprint-spec)
# Deploys the unified full-stack Spends Predictor application:
# 1. PostgreSQL database
# 2. Java 21+ Spring Boot 3 (Thymeleaf + HTMX Web UI + In-JVM QuantCore & Ledger Verifier + Python ML Engine)

databases:
  - name: spends-predictor-db
    databaseName: spends
    user: spends
    plan: free

services:
  - type: web
    name: spends-predictor
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_CURRENCY
        value: INR
      - key: COOKIE_SECURE
        value: "true"
      - key: DEV_LOGIN_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: spends-predictor-db
          property: connectionString
